project_id = "voxl"

[api]
enabled = true
port = 56421
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 56422
shadow_port = 56420
major_version = 15

[db.pooler]
enabled = false
port = 56429

[db.seed]
enabled = false

[studio]
enabled = true
port = 56423

[local_smtp]
enabled = true
port = 56424

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5740"
additional_redirect_urls = ["http://localhost:5740", "http://127.0.0.1:5740"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[analytics]
enabled = true
port = 56427
backend = "postgres"
